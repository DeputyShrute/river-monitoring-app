name: Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests
      run: |
        npm run type-check
        npm run lint
        npm run build
      env:
        NEXT_PUBLIC_WEATHER_API_KEY: ${{ secrets.NEXT_PUBLIC_WEATHER_API_KEY }}
    
    - name: Generate changelog
      id: changelog
      run: |
        # Generate changelog from commits since last tag
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -z "$LAST_TAG" ]; then
          COMMITS=$(git log --pretty=format:"- %s" --reverse)
        else
          COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s" --reverse)
        fi
        
        echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
        echo "$COMMITS" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    
    - name: Get next version
      id: version
      run: |
        # Simple semantic versioning based on commit messages
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        LAST_VERSION=${LAST_TAG#v}
        
        # Parse version parts
        IFS='.' read -ra VERSION_PARTS <<< "$LAST_VERSION"
        MAJOR=${VERSION_PARTS[0]:-0}
        MINOR=${VERSION_PARTS[1]:-0}
        PATCH=${VERSION_PARTS[2]:-0}
        
        # Check for breaking changes, features, or fixes
        COMMITS_SINCE_TAG=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")
        
        if echo "$COMMITS_SINCE_TAG" | grep -q "BREAKING\|breaking:"; then
          MAJOR=$((MAJOR + 1))
          MINOR=0
          PATCH=0
        elif echo "$COMMITS_SINCE_TAG" | grep -q "feat:"; then
          MINOR=$((MINOR + 1))
          PATCH=0
        else
          PATCH=$((PATCH + 1))
        fi
        
        NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "Next version: $NEW_VERSION"
    
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.version }}
        release_name: River Monitoring App ${{ steps.version.outputs.version }}
        body: |
          ## Changes in this Release
          
          ${{ steps.changelog.outputs.CHANGELOG }}
          
          ## Deployment
          
          This release is automatically deployed to production at:
          - **Production**: https://river-monitoring-app.vercel.app
          
          ## Emergency Use Features
          
          - ⚡ Fast loading times for emergency access
          - 📱 Mobile-optimized interface
          - 🌐 Offline capabilities for areas with poor connectivity
          - ♿ Full accessibility support
          
          ## API Integration
          
          - 🌊 Environment Agency flood monitoring data
          - ⛈️ OpenWeatherMap weather integration
          - 📊 Real-time river level monitoring
          
          ---
          
          **Emergency Note**: This application helps monitor flood risks. In case of immediate danger, contact emergency services directly.
        draft: false
        prerelease: false

  notify-deployment:
    needs: release
    runs-on: ubuntu-latest
    if: success()
    
    steps:
    - name: Notify deployment success
      run: |
        echo "✅ Release ${{ needs.release.outputs.version }} deployed successfully"
        echo "🔗 Production URL: https://river-monitoring-app.vercel.app"